appId: com.andylu.studytracker
productName: Study Tracker
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
# The Claude connector runs outside the app archive, under the app's own executable.
asarUnpack:
  - out/mcp/**
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: StudyTracker-Setup-${version}.${ext}
  shortcutName: Study Tracker
portable:
  artifactName: StudyTracker-Portable-${version}.${ext}
mac:
  icon: build/icon-mac.png
  category: public.app-category.education
  darkModeSupport: true
  # No paid Apple certificate: sign "ad-hoc" so the app runs on Apple Silicon.
  # Users confirm it once under System Settings > Privacy & Security.
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [universal]
dmg:
  artifactName: StudyTracker-${version}-mac.${ext}
